<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Formulário guiado — modo escuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
[data-scroll]>*{flex-shrink:0}
[data-scroll]::-webkit-scrollbar{display:none}
a{color:#8DB6EE}a:hover{color:#B5D0F5}
</style>
</helmet>
<div data-scroll="" style="width: 390px; height: 844px; box-sizing: border-box; background: #10151D; color: #ECF0F5; font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 34px; gap: 22px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Hub.dc.html" aria-label="Fechar e salvar" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #ECF0F5; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </a>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Como o negócio funciona</span>
      <span style="font-size: 14px; color: #A6B0BE">{{numero}} de 9</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Pergunta {{numero}} de 9">
      <sc-for list="{{segmentos}}" as="s" hint-placeholder-count="9">
        <span style="height: 6px; border-radius: 3px; background: {{s.cor}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8DB6EE">{{q.bloco}}</span>
    <h1 style="margin: 0; font-family: 'Poppins', 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em; text-wrap: balance">{{q.pergunta}}</h1>
  </div>

  <div style="background: #19212C; border: 1px solid #2A3442; border-radius: 14px; padding: 0 16px">
    <button onClick="{{toggleAjuda}}" aria-expanded="{{ajudaAberta}}" style="width: 100%; min-height: 48px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 600; color: #8DB6EE; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      <span style="flex: 1">Por que isso importa?</span>
      <span style="font-size: 13px; color: #A6B0BE">{{ajudaRotulo}}</span>
    </button>
    <sc-if value="{{ajudaAberta}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5; color: #C3CBD6">{{q.ajuda}}</p>
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="resposta" style="font-size: 14px; color: #A6B0BE">Sua resposta</label>
    <textarea id="resposta" rows="5" value="{{resposta}}" onChange="{{setResposta}}" placeholder="Escreva do seu jeito, sem medo de errar" style="box-sizing: border-box; width: 100%; min-height: 150px; resize: none; border: 2px solid #8DB6EE; border-radius: 14px; background: #19212C; padding: 14px 16px; font-family: inherit; font-size: 17px; line-height: 1.5; color: #ECF0F5"></textarea>
    <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: #A6B0BE">
      <span style="font-weight: 700; color: #ECF0F5; flex-shrink: 0">Ex.:</span>
      <span>{{q.exemplo}}</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <sc-if value="{{naoUltima}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{pular}}" style="align-self: center; min-height: 44px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #A6B0BE; text-decoration: underline; text-underline-offset: 3px">Pular por enquanto</button>
    </sc-if>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
      <sc-if value="{{primeira}}" hint-placeholder-val="{{ true }}">
        <a href="Hub.dc.html" style="min-height: 56px; border-radius: 16px; border: 1px solid #3A4556; background: #19212C; color: #ECF0F5; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Voltar</a>
      </sc-if>
      <sc-if value="{{naoPrimeira}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{voltar}}" style="min-height: 56px; border-radius: 16px; border: 1px solid #3A4556; background: #19212C; color: #ECF0F5; font-family: inherit; font-size: 17px; font-weight: 600">Voltar</button>
      </sc-if>
      <sc-if value="{{naoUltima}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{proxima}}" style="min-height: 56px; border-radius: 16px; border: 0; background: #8DB6EE; color: #0D1A2E; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Próxima
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        </button>
      </sc-if>
      <sc-if value="{{ultima}}" hint-placeholder-val="{{ false }}">
        <a href="Hub.dc.html" style="min-height: 56px; border-radius: 16px; background: #8DB6EE; color: #0D1A2E; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; text-decoration: none">Concluir bloco
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        </a>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.perguntas = [
      { n: 7, bloco: 'Atividades principais', pergunta: 'O que você precisa fazer toda semana para o negócio funcionar?', ajuda: 'São as tarefas que, se pararem, o negócio para. Ajuda a ver quanto tempo e quanta gente você vai precisar.', exemplo: 'hamburgueria de bairro — comprar insumos, montar os lanches, fazer as entregas, postar no Instagram.' },
      { n: 8, bloco: 'Recursos principais', pergunta: 'O que você precisa ter para conseguir trabalhar?', ajuda: 'Equipamentos, lugar, pessoas e conhecimento. Pense no que faria falta se sumisse amanhã.', exemplo: 'chapa, freezer, moto de entrega e a receita do molho.' },
      { n: 9, bloco: 'Parcerias principais', pergunta: 'Quem, de fora do negócio, pode te ajudar?', ajuda: 'Fornecedores, parceiros e quem indica você. Bons parceiros baixam custos ou trazem clientes.', exemplo: 'padaria que entrega o pão, açougue do bairro, síndico do condomínio vizinho.' }
    ];
    this.state = { i: 0, ajuda: true, respostas: ['Comprar carne e pão na sexta, preparar os molhos, atender pedidos no WhatsApp', '', ''] };
  }
  renderVals() {
    var self = this;
    var i = this.state.i;
    var q = this.perguntas[i];
    var segmentos = [];
    for (var k = 1; k <= 9; k++) {
      var cor = '#2A3442';
      if (k < q.n) cor = '#8DB6EE';
      if (k === q.n) cor = '#EF6F7A';
      segmentos.push({ cor: cor });
    }
    var ultima = i === this.perguntas.length - 1;
    return {
      q: q,
      numero: q.n,
      segmentos: segmentos,
      resposta: this.state.respostas[i],
      ajudaAberta: this.state.ajuda,
      ajudaRotulo: this.state.ajuda ? 'Fechar' : 'Abrir',
      primeira: i === 0,
      naoPrimeira: i !== 0,
      ultima: ultima,
      naoUltima: !ultima,
      toggleAjuda: function () { self.setState({ ajuda: !self.state.ajuda }); },
      setResposta: function (e) {
        var r = self.state.respostas.slice();
        r[self.state.i] = e.target.value;
        self.setState({ respostas: r });
      },
      proxima: function () { self.setState({ i: Math.min(self.state.i + 1, self.perguntas.length - 1) }); },
      pular: function () { self.setState({ i: Math.min(self.state.i + 1, self.perguntas.length - 1) }); },
      voltar: function () { self.setState({ i: Math.max(self.state.i - 1, 0) }); }
    };
  }
}
</script>
</body>
</html>
