<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Plano de ação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
[data-scroll]>*{flex-shrink:0}
[data-scroll]::-webkit-scrollbar{display:none}
a{color:#1F4F8F}a:hover{color:#173B6C}
</style>
</helmet>
<div data-scroll="" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; color: #18212E; font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 34px; gap: 16px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <a href="Hub.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #18212E">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Poppins', 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.015em">Plano de ação</h1>
    <p style="margin: 0; font-size: 15px; color: #545F6E">{{resumo}}</p>
  </div>

  <div style="display: flex; gap: 8px; position: relative">
    <label for="nova" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nova tarefa</label>
    <input id="nova" value="{{nova}}" onChange="{{setNova}}" onKeyDown="{{teclaNova}}" placeholder="O que precisa ser feito?" style="flex: 1; min-width: 0; min-height: 52px; box-sizing: border-box; border: 1px solid #D6CFC3; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #18212E">
    <button onClick="{{adicionar}}" aria-label="Adicionar tarefa" style="width: 52px; height: 52px; border: 0; border-radius: 14px; background: #1F4F8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </button>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{pendentes}}" as="t" hint-placeholder-count="4">
      <li style="background: #FFFFFF; border: 1px solid #E7E1D7; border-radius: 16px; padding: 6px 8px 6px 4px; display: flex; align-items: center; gap: 4px">
        <button onClick="{{t.alternar}}" aria-label="Marcar como feita: {{t.nome}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid #8A93A0; box-sizing: border-box"></span></button>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 6px 0"><span style="font-size: 16px; font-weight: 600">{{t.nome}}</span><span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: #545F6E"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16"></path><path d="M9 3v4"></path><path d="M15 3v4"></path></svg>{{t.data}}</span></span>
        <sc-if value="{{t.lembrete}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{t.sino}}" aria-label="Lembrete ativado" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #E4ECF7; color: #1F4F8F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
        </sc-if>
        <sc-if value="{{t.semLembrete}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{t.sino}}" aria-label="Ativar lembrete" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #8A93A0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <sc-if value="{{temFeitas}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #545F6E">Feitas</span>
      <sc-for list="{{feitas}}" as="t" hint-placeholder-count="1">
        <div style="border-radius: 16px; padding: 6px 8px 6px 4px; display: flex; align-items: center; gap: 4px; background: #F2EEE7">
          <button onClick="{{t.alternar}}" aria-label="Desmarcar: {{t.nome}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 8px; background: #1F4F8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 6px 0"><span style="font-size: 16px; color: #545F6E; text-decoration: line-through">{{t.nome}}</span><span style="font-size: 13px; color: #545F6E">{{t.data}}</span></span>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      nova: '',
      tarefas: [
        { id: 1, nome: 'Fechar fornecedor de pão', data: '28 out', lembrete: true, feita: false },
        { id: 2, nome: 'Criar o Instagram da loja', data: '4 nov', lembrete: false, feita: false },
        { id: 3, nome: 'Testar o cardápio com vizinhos', data: '15 nov', lembrete: true, feita: false },
        { id: 4, nome: 'Cadastrar no app de delivery', data: '1 dez', lembrete: false, feita: false },
        { id: 5, nome: 'Abrir o MEI', data: '10 out', lembrete: false, feita: true }
      ],
      proxId: 6
    };
  }
  mudar(id, campo) {
    var lista = this.state.tarefas.map(function (t) {
      if (t.id !== id) return t;
      var c = Object.assign({}, t);
      c[campo] = !t[campo];
      return c;
    });
    this.setState({ tarefas: lista });
  }
  adicionarTarefa() {
    var nome = (this.state.nova || '').trim();
    if (!nome) return;
    var nova = { id: this.state.proxId, nome: nome, data: 'Sem data', lembrete: false, feita: false };
    this.setState({ tarefas: [nova].concat(this.state.tarefas), nova: '', proxId: this.state.proxId + 1 });
  }
  renderVals() {
    var self = this;
    var com = function (t) {
      return Object.assign({}, t, {
        semLembrete: !t.lembrete,
        alternar: function () { self.mudar(t.id, 'feita'); },
        sino: function () { self.mudar(t.id, 'lembrete'); }
      });
    };
    var pendentes = this.state.tarefas.filter(function (t) { return !t.feita; }).map(com);
    var feitas = this.state.tarefas.filter(function (t) { return t.feita; }).map(com);
    var total = this.state.tarefas.length;
    return {
      nova: this.state.nova,
      pendentes: pendentes,
      feitas: feitas,
      temFeitas: feitas.length > 0,
      resumo: feitas.length + ' de ' + total + ' feitas' + (pendentes.length ? ' · próxima: ' + pendentes[0].data : ' · tudo em dia!'),
      setNova: function (e) { self.setState({ nova: e.target.value }); },
      teclaNova: function (e) { if (e.key === 'Enter') self.adicionarTarefa(); },
      adicionar: function () { self.adicionarTarefa(); }
    };
  }
}
</script>
</body>
</html>
