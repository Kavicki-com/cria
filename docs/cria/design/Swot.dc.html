<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Forças e fraquezas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
[data-scroll]>*{flex-shrink:0}
[data-scroll]::-webkit-scrollbar{display:none}
a{color:#1F4F8F}a:hover{color:#173B6C}
</style>
</helmet>
<div data-scroll="" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; color: #18212E; font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 34px; gap: 18px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Hub.dc.html" aria-label="Fechar e salvar" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #18212E; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </a>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Forças e fraquezas <span style="font-weight: 400; color: #545F6E">· SWOT</span></span>
      <span style="font-size: 14px; color: #545F6E">{{numero}} de 4</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Parte {{numero}} de 4">
      <sc-for list="{{segmentos}}" as="s" hint-placeholder-count="4">
        <span style="height: 6px; border-radius: 3px; background: {{s.cor}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
    <span style="align-self: flex-start; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; background: {{p.tagFundo}}; color: {{p.tagTexto}}">{{p.nome}} · {{p.tipo}}</span>
    <h1 style="margin: 0; font-family: 'Poppins', 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em; text-wrap: balance">{{p.pergunta}}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #545F6E">{{p.ajuda}}</p>
  </div>

  <div style="display: flex; gap: 8px; position: relative">
    <label for="item" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Adicionar item</label>
    <input id="item" value="{{novo}}" onChange="{{setNovo}}" onKeyDown="{{tecla}}" placeholder="{{p.placeholder}}" style="flex: 1; min-width: 0; min-height: 52px; box-sizing: border-box; border: 2px solid #1F4F8F; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #18212E">
    <button onClick="{{adicionar}}" aria-label="Adicionar" style="width: 52px; height: 52px; border: 0; border-radius: 14px; background: #1F4F8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </button>
  </div>

  <sc-if value="{{temItens}}" hint-placeholder-val="{{ true }}">
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{itens}}" as="it" hint-placeholder-count="3">
        <li style="background: #FFFFFF; border: 1px solid #E7E1D7; border-radius: 14px; padding: 4px 4px 4px 16px; display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; font-size: 16px; line-height: 1.4; padding: 10px 0">{{it.texto}}</span>
          <button onClick="{{it.remover}}" aria-label="Remover {{it.texto}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #8A93A0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
          </button>
        </li>
      </sc-for>
    </ul>
  </sc-if>
  <sc-if value="{{semItens}}" hint-placeholder-val="{{ false }}">
    <div style="border: 1px dashed #C9C1B3; border-radius: 14px; padding: 16px; display: flex; gap: 8px; font-size: 14px; line-height: 1.45; color: #545F6E">
      <span style="font-weight: 700; color: #18212E; flex-shrink: 0">Ex.:</span>
      <span>{{p.exemplo}}</span>
    </div>
  </sc-if>
  <span style="font-size: 13px; color: #545F6E">Dica: de 2 a 4 itens curtos já bastam.</span>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <sc-if value="{{primeira}}" hint-placeholder-val="{{ true }}">
      <a href="Hub.dc.html" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6CFC3; background: #FFFFFF; color: #18212E; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Voltar</a>
    </sc-if>
    <sc-if value="{{naoPrimeira}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{voltar}}" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6CFC3; background: #FFFFFF; color: #18212E; font-family: inherit; font-size: 17px; font-weight: 600">Voltar</button>
    </sc-if>
    <sc-if value="{{naoUltima}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{proxima}}" style="min-height: 56px; border-radius: 16px; border: 0; background: #1F4F8F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Próxima
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{ultima}}" hint-placeholder-val="{{ false }}">
      <a href="Revisao-swot.dc.html" style="min-height: 56px; border-radius: 16px; background: #1F4F8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; text-decoration: none">Ver resultado</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.partes = [
      { nome: 'Forças', tipo: 'ajuda, dentro do negócio', tagFundo: '#E4ECF7', tagTexto: '#173B6C', pergunta: 'No que o seu negócio já é bom?', ajuda: 'Pense no que os clientes elogiam ou no que você faz melhor que os outros.', placeholder: 'Ex.: entrega rápida', exemplo: 'receita própria de molho, entrega rápida, conhece os clientes pelo nome.' },
      { nome: 'Fraquezas', tipo: 'atrapalha, dentro do negócio', tagFundo: '#EDE8DF', tagTexto: '#3A4555', pergunta: 'O que ainda falta ou pesa no seu negócio?', ajuda: 'Sem culpa: é o que você pode melhorar. Falta de gente, de dinheiro, de tempo.', placeholder: 'Ex.: só uma pessoa na cozinha', exemplo: 'só uma pessoa na cozinha, pouco dinheiro guardado, sem redes sociais.' },
      { nome: 'Oportunidades', tipo: 'ajuda, fora do negócio', tagFundo: '#FCE3E5', tagTexto: '#8A2433', pergunta: 'O que está acontecendo lá fora que pode te ajudar?', ajuda: 'Mudanças no bairro, no comportamento das pessoas ou no mercado.', placeholder: 'Ex.: prédios novos na região', exemplo: 'mais gente trabalhando de casa, prédios novos, feiras de rua.' },
      { nome: 'Ameaças', tipo: 'atrapalha, fora do negócio', tagFundo: '#ECE7F5', tagTexto: '#4B2E83', pergunta: 'O que, lá fora, pode atrapalhar seus planos?', ajuda: 'Coisas que você não controla, mas precisa ficar de olho.', placeholder: 'Ex.: alta no preço da carne', exemplo: 'alta no preço da carne, redes grandes com promoção, taxas dos apps.' }
    ];
    this.state = {
      i: 0,
      novo: '',
      itens: [
        ['Receita própria de molho', 'Entrega rápida, raio curto', 'Conhece a vizinhança pelo nome'],
        ['Só uma pessoa na cozinha', 'Pouco dinheiro guardado'],
        ['Mais gente trabalhando de casa'],
        []
      ]
    };
  }
  adicionarItem() {
    var t = (this.state.novo || '').trim();
    if (!t) return;
    var todos = this.state.itens.map(function (l) { return l.slice(); });
    todos[this.state.i].push(t);
    this.setState({ itens: todos, novo: '' });
  }
  renderVals() {
    var self = this;
    var i = this.state.i;
    var lista = this.state.itens[i];
    var segmentos = [0, 1, 2, 3].map(function (k) {
      return { cor: k < i ? '#1F4F8F' : (k === i ? '#EF6F7A' : '#E7E1D7') };
    });
    var ultima = i === 3;
    return {
      p: this.partes[i],
      numero: i + 1,
      segmentos: segmentos,
      novo: this.state.novo,
      temItens: lista.length > 0,
      semItens: lista.length === 0,
      itens: lista.map(function (texto, k) {
        return { texto: texto, remover: function () {
          var todos = self.state.itens.map(function (l) { return l.slice(); });
          todos[self.state.i].splice(k, 1);
          self.setState({ itens: todos });
        } };
      }),
      primeira: i === 0,
      naoPrimeira: i !== 0,
      ultima: ultima,
      naoUltima: !ultima,
      setNovo: function (e) { self.setState({ novo: e.target.value }); },
      tecla: function (e) { if (e.key === 'Enter') self.adicionarItem(); },
      adicionar: function () { self.adicionarItem(); },
      proxima: function () { self.setState({ i: Math.min(self.state.i + 1, 3), novo: '' }); },
      voltar: function () { self.setState({ i: Math.max(self.state.i - 1, 0), novo: '' }); }
    };
  }
}
</script>
</body>
</html>
